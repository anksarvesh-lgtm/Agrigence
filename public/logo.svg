<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <defs>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Nib + Leaf -->
  <g transform="translate(20, 20) scale(0.25)">
    <path d="M225,50 L100,300 L225,450 L350,300 Z" fill="url(#nibGrad)" />
    <path d="M225,50 L225,450" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <circle cx="225" cy="250" r="15" fill="#ffffff" />
    <!-- Sprouting Leaves -->
    <path d="M225,320 Q120,320 100,220 Q150,200 225,280" fill="#40916c" />
    <path d="M225,320 Q330,320 350,220 Q300,200 225,280" fill="#40916c" />
    <path d="M225,450 L225,280" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>
  <!-- Brand Name -->
  <text x="145" y="85" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#1b4332">Agrigence</text>
  <!-- Tagline -->
  <text x="147" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5" fill="#52796f">Where Agri-Intelligence Meets Agricultural Generations</text>
</svg>
