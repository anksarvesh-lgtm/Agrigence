
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders Manager - Agrigence Extension</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] },
            colors: {
              agri: { primary: '#3D2B1F', secondary: '#C29263', bg: '#FDFCFB' }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FDFCFB; color: #3D2B1F; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #C29263; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-[#1C1510] text-white py-6 px-8 flex justify-between items-center border-b border-white/10">
        <div>
            <h1 class="text-xl font-serif font-bold">Founders Extension</h1>
            <p class="text-[10px] uppercase tracking-widest text-white/40">Founder & Co-Founder Management Node</p>
        </div>
        <div id="user-status" class="text-xs font-bold text-agri-secondary">Checking Auth...</div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-8 max-w-5xl mx-auto w-full">
        
        <div id="auth-warning" class="hidden bg-red-100 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm font-bold">
            Access Denied. You must be logged in to manage founder data.
        </div>

        <div id="dashboard" class="hidden space-y-8">
            
            <!-- Controls -->
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-lg border border-stone-100">
                <div>
                    <h2 class="font-bold text-lg">Team Configuration</h2>
                    <p class="text-xs text-stone-400">Manage profiles stored in <code class="bg-stone-100 px-1 py-0.5 rounded text-stone-600">leadership/founders.json</code></p>
                </div>
                <button onclick="saveConfig()" id="save-btn" class="bg-agri-secondary hover:bg-agri-primary text-white px-8 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-all shadow-xl flex items-center gap-2">
                    Save Changes
                </button>
            </div>

            <!-- List -->
            <div id="members-list" class="grid md:grid-cols-2 gap-6">
                <!-- Items injected here -->
            </div>

            <!-- Add New -->
            <div class="bg-stone-100 border-2 border-dashed border-stone-200 rounded-3xl p-8 text-center hover:bg-white hover:border-agri-secondary/30 transition-all cursor-pointer group" onclick="addMember()">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm group-hover:scale-110 transition-transform">
                    <svg width="24" height="24" fill="none" stroke="#C29263" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </div>
                <span class="text-xs font-bold text-stone-400 uppercase tracking-widest">Add New Profile</span>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // Config matches main app
        const firebaseConfig = {
            apiKey: "AIzaSyAtJrLiAnhN5A4umArJKtqhnWmoXXf27K8",
            authDomain: "gen-lang-client-0276037966.firebaseapp.com",
            projectId: "gen-lang-client-0276037966",
            storageBucket: "gen-lang-client-0276037966.firebasestorage.app",
            messagingSenderId: "455779719985",
            appId: "1:455779719985:web:07fc0a4b6a3234cfdeae10",
            measurementId: "G-ZRQEY0LBJC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);
        
        const DATA_PATH = 'leadership/founders.json';
        let members = [];

        // Auth Check
        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('user-status');
            const dashEl = document.getElementById('dashboard');
            const warnEl = document.getElementById('auth-warning');

            // Relaxed check: Allow any authenticated user.
            if (user) {
                statusEl.innerHTML = `<span class="text-green-400">●</span> ${user.email}`;
                dashEl.classList.remove('hidden');
                warnEl.classList.add('hidden');
                loadData();
            } else {
                statusEl.innerText = 'Not Authorized';
                dashEl.classList.add('hidden');
                warnEl.classList.remove('hidden');
            }
        });

        // Load Data
        async function loadData() {
            try {
                const url = `https://firebasestorage.googleapis.com/v0/b/${firebaseConfig.storageBucket}/o/${encodeURIComponent(DATA_PATH)}?alt=media`;
                const res = await fetch(url);
                if (res.ok) {
                    members = await res.json();
                } else {
                    console.warn("No existing config found, starting empty.");
                    members = [];
                }
                render();
            } catch (e) {
                console.error("Load failed", e);
                render(); // If 404, just start empty
            }
        }

        // Render List
        window.render = function() {
            const container = document.getElementById('members-list');
            // Sort by order
            members.sort((a,b) => (a.order || 0) - (b.order || 0));

            container.innerHTML = members.map((m, idx) => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100 flex gap-6 items-start group relative">
                    <div class="relative w-24 h-24 bg-stone-100 rounded-xl overflow-hidden shrink-0 border border-stone-200">
                        <img src="${m.image || 'https://via.placeholder.com/150?text=No+Image'}" class="w-full h-full object-cover" id="img-${idx}">
                        <label class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center cursor-pointer transition-opacity text-white text-[10px] font-bold uppercase text-center backdrop-blur-sm">
                            <span class="p-1">Upload</span>
                            <input type="file" class="hidden" onchange="uploadImage(${idx}, this)">
                        </label>
                    </div>
                    <div class="flex-1 space-y-3 min-w-0">
                        <div>
                            <label class="block text-[9px] font-black text-stone-300 uppercase tracking-widest">Name</label>
                            <input value="${m.name}" oninput="updateMember(${idx}, 'name', this.value)" class="w-full font-serif font-bold text-lg text-agri-primary bg-transparent border-b border-stone-200 focus:border-agri-secondary outline-none py-1 transition-colors" placeholder="Dr. Name">
                        </div>
                        <div>
                            <label class="block text-[9px] font-black text-stone-300 uppercase tracking-widest">Role</label>
                            <select onchange="updateMember(${idx}, 'role', this.value)" class="w-full text-xs font-bold text-stone-500 bg-transparent border-b border-stone-200 outline-none py-1 focus:border-agri-secondary">
                                <option value="Founder" ${m.role === 'Founder' ? 'selected' : ''}>Founder</option>
                                <option value="Co-Founder" ${m.role === 'Co-Founder' ? 'selected' : ''}>Co-Founder</option>
                                <option value="Managing Director" ${m.role === 'Managing Director' ? 'selected' : ''}>Managing Director</option>
                                <option value="Advisor" ${m.role === 'Advisor' ? 'selected' : ''}>Advisor</option>
                                <option value="Board Member" ${m.role === 'Board Member' ? 'selected' : ''}>Board Member</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-black text-stone-300 uppercase tracking-widest">Vision Message</label>
                            <textarea oninput="updateMember(${idx}, 'message', this.value)" class="w-full text-xs text-stone-500 bg-stone-50 rounded p-2 border border-stone-100 outline-none focus:border-agri-secondary resize-none h-16" placeholder="Vision statement...">${m.message || ''}</textarea>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 absolute top-4 right-4">
                        <button onclick="moveMember(${idx}, -1)" class="p-1.5 bg-stone-50 rounded-lg text-stone-400 hover:text-agri-secondary hover:bg-white border border-stone-100 transition-all"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg></button>
                        <button onclick="moveMember(${idx}, 1)" class="p-1.5 bg-stone-50 rounded-lg text-stone-400 hover:text-agri-secondary hover:bg-white border border-stone-100 transition-all"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
                        <button onclick="deleteMember(${idx})" class="p-1.5 bg-stone-50 rounded-lg text-stone-400 hover:text-red-500 hover:bg-white border border-stone-100 transition-all mt-2"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                    </div>
                    <div class="absolute bottom-4 right-4">
                         <label class="flex items-center gap-2 cursor-pointer">
                            <span class="text-[9px] font-black uppercase ${m.active ? 'text-green-500' : 'text-stone-300'}">${m.active ? 'Active' : 'Hidden'}</span>
                            <input type="checkbox" ${m.active ? 'checked' : ''} onchange="updateMember(${idx}, 'active', this.checked)" class="accent-agri-secondary">
                         </label>
                    </div>
                </div>
            `).join('');
        };

        // Actions
        window.addMember = function() {
            members.push({ id: Date.now().toString(), name: "New Profile", role: "Founder", image: "", message: "", order: members.length, active: true });
            render();
        };

        window.updateMember = function(idx, field, value) {
            members[idx][field] = value;
            if(field === 'active') render(); // re-render to update label color
        };

        window.moveMember = function(idx, dir) {
            if (idx + dir < 0 || idx + dir >= members.length) return;
            [members[idx], members[idx + dir]] = [members[idx + dir], members[idx]];
            members.forEach((m, i) => m.order = i);
            render();
        };

        window.deleteMember = function(idx) {
            if(confirm("Remove this profile permanently?")) {
                members.splice(idx, 1);
                render();
            }
        };

        window.uploadImage = async function(idx, input) {
            const file = input.files[0];
            if(!file) return;
            
            const parent = input.parentElement;
            const originalHtml = parent.innerHTML;
            parent.innerHTML = '<div class="loader"></div>';
            parent.classList.remove('opacity-0'); 
            parent.classList.add('bg-white');

            try {
                // Use 'leadership' path to match storage rules
                const storageRef = ref(storage, `leadership/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`);
                const snapshot = await uploadBytes(storageRef, file);
                const url = await getDownloadURL(snapshot.ref);
                members[idx].image = url;
                render();
            } catch(e) {
                console.error(e);
                alert("Upload failed. Ensure you are an admin.");
                parent.innerHTML = originalHtml;
                parent.classList.add('opacity-0');
            }
        };

        window.saveConfig = async function() {
            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;
            btn.innerHTML = '<div class="loader border-white border-t-transparent w-4 h-4"></div> Saving...';
            btn.disabled = true;

            try {
                // Ensure order is correct
                members.forEach((m, i) => m.order = i);
                
                const blob = new Blob([JSON.stringify(members)], { type: "application/json" });
                const storageRef = ref(storage, DATA_PATH);
                await uploadBytes(storageRef, blob);
                
                // Add visual feedback
                btn.innerHTML = 'Saved Successfully!';
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('bg-green-600');
                    btn.disabled = false;
                }, 2000);
            } catch(e) {
                console.error(e);
                alert("Failed to save configuration. Check permissions.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
