
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Global Targeting & SEO -->
    <title>Agrigence - International Agriculture Journal</title>
    <meta name="description" content="Agrigence is an international platform for agricultural research, innovation, and scholarly publication connecting authors, reviewers, and institutions worldwide.">
    <meta name="keywords" content="international agriculture journal, global research publication, agricultural innovation, peer-reviewed articles, worldwide authors, academic publishing platform">
    <meta name="author" content="Agrigence">
    
    <!-- International SEO Signals -->
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="audience" content="Global">
    <meta name="content-language" content="en">
    <meta http-equiv="Content-Language" content="en">
    
    <link rel="alternate" hreflang="x-default" href="https://agrigence.com/" />
    <link rel="alternate" hreflang="en" href="https://agrigence.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://agrigence.com/">
    <meta property="og:title" content="Agrigence - Global Agricultural Research & Publication">
    <meta property="og:description" content="Join the premier international ecosystem for agricultural knowledge, research publishing, and global innovation.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1625246333195-58197bdc0700?auto=format&fit=crop&q=80">
    <meta property="og:site_name" content="Agrigence">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Agrigence - International Agriculture Journal">
    <meta name="twitter:description" content="Building a Trusted International Digital Agriculture Magazine and Research Publishing Platform.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1625246333195-58197bdc0700?auto=format&fit=crop&q=80">

    <!-- Structured Data (Organization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Agrigence",
      "url": "https://agrigence.com",
      "areaServed": {
        "@type": "Place",
        "name": "Worldwide"
      },
      "sameAs": [
        "https://www.linkedin.com/company/agrigence",
        "https://www.youtube.com/@agrigence"
      ]
    }
    </script>

    <link id="dynamic-favicon" rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" />
    
    <!-- Razorpay Payment Gateway -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <!-- Tailwind CDN for styling configuration -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-earth: #3D2B1F; /* Deep Earth Brown */
        --secondary-tan: #C29263; /* Golden Harvest Tan */
        --accent-gold: #D4A373; 
        --bg-silk: #FDFCFB; /* Warm Silk White */
        --text-charcoal: #262626;
        --border-sepia: #E5E1DD;
      }
      body {
        background-color: var(--bg-silk);
        color: var(--text-charcoal);
        background-image: radial-gradient(#D6D3D1 0.5px, transparent 0.5px);
        background-size: 30px 30px;
      }
      .premium-shadow {
        box-shadow: 0 10px 40px -10px rgba(61, 43, 31, 0.1);
      }
      .harvest-gradient {
        background: linear-gradient(135deg, var(--primary-earth) 0%, #5C4033 100%);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
            },
            colors: {
              agri: {
                primary: 'var(--primary-earth)',
                secondary: 'var(--secondary-tan)',
                gold: 'var(--accent-gold)',
                bg: 'var(--bg-silk)',
                text: 'var(--text-charcoal)',
                border: 'var(--border-sepia)',
                accent: '#8B5E34',
              },
              admin: {
                bg: '#FDFCFB',       // Bright Warm White
                card: '#FFFFFF',     // Pure White
                text: '#000000',     // Pure Black for Text
                secondary: '#333333',// Dark Charcoal for secondary text
                muted: '#57534E',    // Stone 600 for muted text
                border: '#E7E5E4',   // Stone 200 for borders
                hover: '#F5F5F4',    // Stone 100 for hover states
                header: '#FFFFFF',   // White Headers
                sidebar: '#F5F5F4',  // Light Stone Sidebar
                sidebarText: '#000000', // Black Sidebar Text
                sidebarHover: '#E7E5E4', // Darker Stone Hover
                input: '#FFFFFF',
                inputBorder: '#D6D3D1', // Stone 300
                inputFocus: '#000000'
              }
            },
            boxShadow: {
              'premium': '0 20px 50px -12px rgba(61, 43, 31, 0.12)',
              'admin': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)'
            },
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
  <body class="bg-agri-bg text-agri-text antialiased selection:bg-agri-secondary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
