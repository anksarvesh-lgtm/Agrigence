    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-earth: #3D2B1F; /* Deep Earth Brown */
        --secondary-tan: #C29263; /* Golden Harvest Tan */
        --accent-gold: #D4A373; 
        --bg-silk: #FDFCFB; /* Warm Silk White */
        --text-charcoal: #262626;
        --border-sepia: #E5E1DD;
      }
      body {
        background-color: var(--bg-silk);
        color: var(--text-charcoal);
        background-image: radial-gradient(#D6D3D1 0.5px, transparent 0.5px);
        background-size: 30px 30px;
      }
      .premium-shadow {
        box-shadow: 0 10px 40px -10px rgba(61, 43, 31, 0.1);
      }
      .harvest-gradient {
        background: linear-gradient(135deg, var(--primary-earth) 0%, #5C4033 100%);
      }

      /* Scroll reveal base state */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        will-change: opacity, transform;
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Slide in from left */
      .slide-left {
        opacity: 0;
        transform: translateX(-30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        will-change: opacity, transform;
      }
      .slide-left.visible {
        opacity: 1;
        transform: translateX(0);
      }

      /* Bounce in scale */
      .bounce-scale {
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        will-change: opacity, transform;
      }
      .bounce-scale.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* Width expand */
      .width-expand {
        width: 0%;
        transition: width 0.6s ease-in-out;
        will-change: width;
      }
      .width-expand.visible {
        width: 100%;
      }

      /* Fade in scale */
      .fade-scale {
        opacity: 0;
        transform: scale(0.96);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        will-change: opacity, transform;
      }
      .fade-scale.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* Fade in zoom */
      .fade-zoom {
        opacity: 0;
        transform: scale(0.97);
        transition: opacity 0.7s ease-out, transform 0.7s ease-out;
        will-change: opacity, transform;
      }
      .fade-zoom.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* Stagger children */
      .stagger-children > *:nth-child(1) { transition-delay: 0.1s; }
      .stagger-children > *:nth-child(2) { transition-delay: 0.2s; }
      .stagger-children > *:nth-child(3) { transition-delay: 0.3s; }
      .stagger-children > *:nth-child(4) { transition-delay: 0.4s; }
      .stagger-children > *:nth-child(5) { transition-delay: 0.5s; }
      .stagger-children > *:nth-child(6) { transition-delay: 0.6s; }

      /* Scroll progress bar */
      #scroll-progress {
        position: fixed;
        top: 0; left: 0;
        height: 3px;
        background: linear-gradient(to right, #2e7d32, #f9a825);
        width: 0%;
        z-index: 9999;
        transition: width 0.1s linear;
      }

      /* Ken Burns */
      @keyframes kenburns {
        from { transform: scale(1); }
        to   { transform: scale(1.05); }
      }
      .ken-burns {
        animation: kenburns 8s infinite alternate ease-in-out;
      }

      /* Hover underline */
      .hover-underline {
        position: relative;
      }
      .hover-underline::after {
        content: '';
        position: absolute;
        width: 0%;
        height: 2px;
        bottom: -2px;
        left: 0;
        background-color: currentColor;
        transition: width 0.3s ease-out;
      }
      .hover-underline:hover::after {
        width: 100%;
      }

      /* Button hover effects */
      .btn-animate {
        transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      }
      .btn-animate:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 20px -10px rgba(0,0,0,0.2);
      }
      .btn-animate:active {
        transform: scale(0.97);
      }
      .btn-animate:focus-visible {
        outline: 2px solid var(--accent-gold);
        outline-offset: 2px;
      }

      /* Input focus glow */
      .input-glow {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .input-glow:focus {
        border-color: var(--accent-gold);
        box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2);
      }

      /* Loading spinner */
      .loading {
        position: relative;
        color: transparent !important;
      }
      .loading::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1.2rem;
        height: 1.2rem;
        margin-top: -0.6rem;
        margin-left: -0.6rem;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spinner 0.6s linear infinite;
      }
      @keyframes spinner {
        to { transform: rotate(360deg); }
      }

      /* Table row highlight */
      .row-highlight {
        position: relative;
        overflow: hidden;
      }
      .row-highlight::before {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0;
        width: 0%;
        background-color: rgba(212, 163, 115, 0.1);
        transition: width 0.3s ease-out;
        z-index: -1;
      }
      .row-highlight:hover::before {
        width: 100%;
      }

      /* Social icon hover */
      .social-icon-animate {
        transition: transform 0.2s ease;
      }
      .social-icon-animate:hover {
        transform: rotate(8deg) scale(1.1);
      }

      /* Pulse border */
      @keyframes pulse-border {
        0% { box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(212, 163, 115, 0); }
        100% { box-shadow: 0 0 0 0 rgba(212, 163, 115, 0); }
      }
      .pulse-border {
        animation: pulse-border 2s infinite;
      }

      /* Link color transition */
      a {
        transition: color 0.2s ease;
      }

      /* Smooth scroll */
      html {
        scroll-behavior: smooth;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
